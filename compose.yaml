services:
  postgres:
    image: postgres:17-alpine
    container_name: civico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civico_dev}
      POSTGRES_DB: ${POSTGRES_DB:-civico}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
